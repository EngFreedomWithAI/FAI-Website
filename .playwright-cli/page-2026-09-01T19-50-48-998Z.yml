            - heading "Advise" [level=3] [ref=f15e127]
            - paragraph [ref=f15e128]: We work with founders on the calls that do not have an obvious answer. Which problem to build around, who will actually buy, what not to build, and what has to be true before anyone trusts you with it.
            - link "How advisory works" [ref=f15e129] [cursor=pointer]:
              - /url: /advisory
              - text: How advisory works →
          - article [ref=f15e130]:
            - heading "Invest" [level=3] [ref=f15e131]
            - paragraph [ref=f15e132]: We are starting to back a small number of founders with our own capital, where we have conviction and can be useful beyond the money.
        - paragraph [ref=f15e133]: Building keeps us honest. Advising shows us the patterns. Investing puts us on the hook for the outcome.
        - paragraph [ref=f15e134]: Advisory and investing are separate decisions. Working with us does not require or promise an investment.
