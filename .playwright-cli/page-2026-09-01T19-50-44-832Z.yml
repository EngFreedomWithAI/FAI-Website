        - generic [ref=f14e19]: Thesis
        - heading "AI is not a software category. It is a stack." [level=1] [ref=f14e21]
        - paragraph [ref=f14e22]: Energy, Chips, Infrastructure, Models, Applications. Push on one layer and the others move. The companies worth building will get built in all five, and at the seams between them.
